<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>腰痛缓解训练</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#07090f;color:#e4e4e7;font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',-apple-system,sans-serif;min-height:100vh;max-width:500px;margin:0 auto}
.hd{background:linear-gradient(180deg,#0f1320,#07090f);padding:20px 20px 14px;border-bottom:1px solid rgba(56,189,170,.1);position:sticky;top:0;z-index:100}
.hd-row{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#38bdaa,#5ce0cc);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0}
.hd h1{font-size:20px;font-weight:700;color:#fff}
.hd .sub{font-size:12px;color:#6b7280;margin-top:2px}
.pbar-wrap{margin-top:14px}
.pbar-info{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:5px}
.pbar{height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.pfill{height:100%;border-radius:3px;background:linear-gradient(90deg,#38bdaa,#7ee8d8);transition:width .5s}

.pills{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#9ca3af;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .25s;position:relative;font-family:inherit}
.pill.on{border:none;background:linear-gradient(135deg,#38bdaa,#5ce0cc);color:#fff;font-weight:600}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:50%;background:#38bdaa;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #07090f}
.badge.dn{background:#22c55e}

.mn{padding:0 20px 40px}

.card{border-radius:18px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.06);margin-bottom:14px}
.vid-box{position:relative;width:100%;background:#0a0a0a}
.vid-box video{width:100%;display:block;background:#111;border-radius:0}
.vid-fallback{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#0a1520,#0f1f2e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#38bdaa;font-size:14px;font-weight:500}
.vid-fallback .icon{font-size:48px;opacity:.6}
.angle-bar{position:absolute;bottom:12px;right:12px;display:flex;gap:4px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);border-radius:10px;padding:3px;z-index:3}
.angle-btn{padding:6px 14px;border-radius:8px;border:none;background:transparent;color:#888;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.angle-btn.on{background:rgba(56,189,170,.9);color:#fff}
.vbadge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);border-radius:8px;padding:4px 10px;font-size:11px;color:#5ce0cc;font-weight:600;z-index:3}
.vtitle{padding:14px 16px;background:linear-gradient(180deg,#111420,#07090f)}
.vtitle h2{font-size:21px;font-weight:700;color:#fff}
.vtitle .en{margin-top:3px;font-size:13px;color:#5ce0cc;font-weight:500}

.dots{display:flex;gap:8px;padding:0 0 14px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#555;cursor:pointer;transition:all .3s;user-select:none}
.dot.dn{background:linear-gradient(135deg,#38bdaa,#5ce0cc);border-color:transparent;color:#fff}
.dot.alldn{background:linear-gradient(135deg,#22c55e,#16a34a)}

.btn{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(135deg,#38bdaa,#2a9e8e);color:#fff;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.5px;transition:all .3s;margin-bottom:14px;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.alldn{background:linear-gradient(135deg,#22c55e,#16a34a)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:rgba(255,255,255,.03);border-radius:14px;padding:13px 15px;border:1px solid rgba(255,255,255,.06)}
.st-l{font-size:11px;color:#6b7280;margin-bottom:5px;font-weight:500}
.st-v{font-size:14px;color:#e4e4e7;font-weight:600;line-height:1.4}
.st-s{font-size:11px;color:#5ce0cc;margin-top:2px}

.kp{background:linear-gradient(135deg,rgba(56,189,170,.08),rgba(56,189,170,.03));border-radius:14px;padding:13px 15px;border:1px solid rgba(56,189,170,.12);margin-bottom:12px;font-size:13px;color:#7ee8d8;font-weight:600;line-height:1.5}

.tips-box{background:rgba(255,255,255,.025);border-radius:14px;border:1px solid rgba(255,255,255,.06);margin-bottom:14px;overflow:hidden}
.tips-hd{width:100%;padding:13px 15px;background:none;border:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:inherit}
.tips-hd span:first-child{font-size:14px;font-weight:600;color:#fff}
.tips-hd span:last-child{font-size:12px;color:#6b7280;transition:transform .2s}
.tips-hd span:last-child.open{transform:rotate(180deg)}
.tips-body{padding:0 15px 15px;display:none}
.tips-body.show{display:block}
.tr{display:flex;gap:10px;margin-bottom:9px}
.tr:last-child{margin-bottom:0}
.tn{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:rgba(56,189,170,.12);color:#38bdaa;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tt{font-size:13px;color:#a1a1aa;line-height:1.5}

.warn-box{background:linear-gradient(135deg,rgba(234,179,8,.06),rgba(234,179,8,.02));border-radius:14px;padding:13px 15px;border:1px solid rgba(234,179,8,.12);margin-bottom:14px;overflow:hidden}
.warn-hd{width:100%;padding:0;background:none;border:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:inherit}
.warn-hd span:first-child{font-size:14px;font-weight:600;color:#eab308}
.warn-hd span:last-child{font-size:12px;color:#6b7280;transition:transform .2s}
.warn-hd span:last-child.open{transform:rotate(180deg)}
.warn-body{padding-top:10px;display:none}
.warn-body.show{display:block}
.warn-body p{font-size:12px;color:#ca8a04;line-height:1.6}

.nav{display:flex;gap:10px;margin-bottom:20px}
.nb{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#9ca3af;font-size:14px;cursor:pointer;font-weight:500;text-align:center;font-family:inherit;transition:all .2s}
.nb:active:not(:disabled){background:rgba(255,255,255,.08)}
.nb:disabled{color:#333;cursor:default}

.ft{margin-top:8px;padding:15px;border-radius:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05)}
.ft h3{font-size:13px;font-weight:600;color:#5ce0cc;margin-bottom:8px}
.ft div{font-size:12px;color:#6b7280;line-height:1.8}
.credit{text-align:center;margin-top:16px;font-size:10px;color:#333}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-row">
    <div class="logo">腰</div>
    <div>
      <h1>腰痛缓解训练</h1>
      <p class="sub">6 个动作 · 纯徒手 · 真人视频演示 · 随时随地可练</p>
    </div>
  </div>
  <div class="pbar-wrap">
    <div class="pbar-info"><span>训练进度</span><span id="ptxt">0/18 组</span></div>
    <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
  </div>
</div>

<div class="pills" id="pills"></div>
<div class="mn" id="mn"></div>

<script>
var E=[
{id:1,n:"臀桥",en:"Glute Bridge",
tgt:"臀大肌、腘绳肌、核心",sets:"3组 × 15次",rest:"每次顶峰停顿2秒",mx:3,
tips:["仰卧屈膝，双脚与髋同宽平踩地面，手臂自然放身体两侧","脚跟发力，臀部收紧向天花板方向推起髋部","顶峰位置肩-髋-膝呈一条直线，停顿2秒充分收缩臀肌","缓慢下放，腰部不要过度反弓，核心全程保持收紧"],
kp:"激活臀肌是缓解腰痛的第一步——臀肌无力时腰椎被迫代偿",
front:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-glute-bridge-front.mp4",
side:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-glute-bridge-side.mp4"},

{id:2,n:"鸟狗式",en:"Bird Dog",
tgt:"竖脊肌、腹横肌、臀中肌、多裂肌",sets:"3组 × 10次/侧",rest:"交替进行",mx:3,
tips:["四点跪撑：手在肩正下方，膝在髋正下方，背部保持自然中立","同时伸出右手和左腿，手指与脚跟向相反方向延伸","保持3秒，想象腹部有一杯水不能洒出——躯干不旋转、不侧倾","缓慢收回到起始位置，换对侧重复"],
kp:"研究证实鸟狗式是激活腹横肌（深层核心）效果最佳的动作之一",
front:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-bird-dog-front.mp4",
side:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-bird-dog-side.mp4"},

{id:3,n:"死虫式",en:"Dead Bug",
tgt:"腹横肌、腹直肌、骨盆底肌、竖脊肌",sets:"3组 × 10次/侧",rest:"呼气时伸展",mx:3,
tips:["仰卧，双臂伸向天花板，双腿抬起屈膝90度（桌面位）","最关键一步：收紧腹肌，将下背部完全压平贴地——全程不能拱起","呼气的同时，对侧手臂和腿缓慢伸出放低，脚跟和手指将触未触地面","吸气收回，换对侧。腰部始终紧贴地面是正确的唯一标准"],
kp:"对腰痛患者最安全的核心训练——仰卧位减少脊柱压力，比卷腹和平板更友好",
front:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-dead-bug-front.mp4",
side:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-dead-bug-side.mp4"},

{id:4,n:"超人式",en:"Supermans",
tgt:"竖脊肌、臀大肌、斜方肌中下束",sets:"3组 × 12次",rest:"顶峰停顿3秒",mx:3,
tips:["俯卧于垫上，双臂向前伸直，双腿自然伸展","同时抬起双臂、胸部和双腿离开地面——不需要抬太高","顶峰停顿2-3秒，感受整条后链的收缩，颈部保持中立（看地面）","缓慢放下回到起始位置。如果腰部不适，可改为交替式（一手一腿）"],
kp:"直接强化整条后链——竖脊肌、臀肌、肩后侧全部参与",
front:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-supermans-front.mp4",
side:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-supermans-side.mp4"},

{id:5,n:"平板支撑",en:"Forearm Plank",
tgt:"腹横肌、腹直肌、竖脊肌、肩袖",sets:"3组 × 30-45秒",rest:"静态保持",mx:3,
tips:["前臂撑地，肘关节在肩正下方，双脚并拢脚尖着地","收紧腹肌和臀肌，身体从头到脚呈一条直线","不要塌腰（最常见错误！）也不要撅臀，骨盆微微后倾","保持正常呼吸，不要憋气。初始者可从膝盖跪地版开始"],
kp:"全身等长收缩训练核心稳定性——塌腰是大忌，宁可时间短也要姿势对",
front:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-forearm-plank-front.mp4",
side:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-forearm-plank-side.mp4"},

{id:6,n:"猫牛式",en:"Cat-Cow Stretch",
tgt:"脊柱活动度、竖脊肌、腹肌",sets:"3组 × 10次",rest:"配合呼吸",mx:3,
tips:["四点跪撑，手在肩下方，膝在髋下方","吸气：腹部下沉，胸口打开，头微微抬起（牛式）——脊柱自然伸展","呼气：收腹弓背，下巴收向胸口，像猫一样把背拱到最高（猫式）","动作缓慢流畅，配合呼吸节奏，感受每一节脊椎依次活动"],
kp:"脊柱最佳热身/收尾动作——温和活动整段脊柱，缓解僵硬和疼痛",
front:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-cat-cow-front.mp4",
side:"https://media.musclewiki.com/media/uploads/videos/branded/male-Bodyweight-cat-cow-side.mp4"}
];

var cur=0,angle='side',done={},tipsOpen=true,warnOpen=false;
var total=E.reduce(function(s,e){return s+e.mx},0);

function gd(id){return done[id]||0}
function gtd(){var s=0;for(var k in done)s+=done[k];return s}

function uprog(){
  var d=gtd();
  document.getElementById('ptxt').textContent=d===total?'🎉 全部完成！':d+'/'+total+' 组';
  var pf=document.getElementById('pfill');
  pf.style.width=(total?(d/total)*100:0)+'%';
  pf.style.background=d===total?'linear-gradient(90deg,#22c55e,#4ade80)':'linear-gradient(90deg,#38bdaa,#7ee8d8)';
}

function rpills(){
  var c=document.getElementById('pills');c.innerHTML='';
  E.forEach(function(e,i){
    var b=document.createElement('button');
    b.className='pill'+(i===cur?' on':'');
    b.textContent=e.n;
    var d=gd(e.id);
    if(d>0){var bg=document.createElement('span');bg.className='badge'+(d>=e.mx?' dn':'');bg.textContent=d>=e.mx?'✓':d;b.appendChild(bg)}
    b.onclick=function(){cur=i;angle='side';render()};
    c.appendChild(b);
  });
  setTimeout(function(){
    if(c.children[cur])c.children[cur].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  },50);
}

function setAngle(a){
  angle=a;
  render();
}

function toggleTips(){
  tipsOpen=!tipsOpen;
  var body=document.getElementById('tipsBody');
  var arrow=document.getElementById('tipsArrow');
  if(body)body.className=tipsOpen?'tips-body show':'tips-body';
  if(arrow)arrow.className=tipsOpen?'open':'';
}

function toggleWarn(){
  warnOpen=!warnOpen;
  var body=document.getElementById('warnBody');
  var arrow=document.getElementById('warnArrow');
  if(body)body.className=warnOpen?'warn-body show':'warn-body';
  if(arrow)arrow.className=warnOpen?'open':'';
}

function render(){
  var e=E[cur],d=gd(e.id),ad=d>=e.mx;
  var videoSrc=angle==='front'?e.front:e.side;
  var m=document.getElementById('mn');
  var h='';

  h+='<div class="card">';
  h+='<div class="vid-box">';
  h+='<video id="mainVid" autoplay loop muted playsinline><source src="'+videoSrc+'" type="video/mp4"></video>';
  h+='<div class="angle-bar">';
  h+='<button class="angle-btn'+(angle==='front'?' on':'')+'" onclick="setAngle(\'front\')">正面</button>';
  h+='<button class="angle-btn'+(angle==='side'?' on':'')+'" onclick="setAngle(\'side\')">侧面</button>';
  h+='</div>';
  h+='<div class="vbadge">'+(cur+1)+' / '+E.length+'</div>';
  h+='</div>';
  h+='<div class="vtitle"><h2>'+e.n+'</h2><p class="en">'+e.en+'</p></div>';
  h+='</div>';

  h+='<div class="dots" id="dots"></div>';

  h+='<button class="btn'+(ad?' alldn':'')+'" onclick="tick('+e.id+')">';
  h+=ad?'✓ 已完成全部 '+e.mx+' 组（点击重置）':'完成第 '+(d+1)+' 组（'+d+'/'+e.mx+'）';
  h+='</button>';

  h+='<div class="stats">';
  h+='<div class="st"><div class="st-l">目标肌群</div><div class="st-v">'+e.tgt+'</div></div>';
  h+='<div class="st"><div class="st-l">训练量</div><div class="st-v">'+e.sets+'</div><div class="st-s">'+e.rest+'</div></div>';
  h+='</div>';

  h+='<div class="kp">💡 '+e.kp+'</div>';

  h+='<div class="tips-box">';
  h+='<div class="tips-hd" onclick="toggleTips()"><span>动作要领</span><span id="tipsArrow" class="'+(tipsOpen?'open':'')+'">▼</span></div>';
  h+='<div class="tips-body'+(tipsOpen?' show':'')+'" id="tipsBody">';
  e.tips.forEach(function(t,i){
    h+='<div class="tr"><span class="tn">'+(i+1)+'</span><span class="tt">'+t+'</span></div>';
  });
  h+='</div></div>';

  h+='<div class="warn-box">';
  h+='<div class="warn-hd" onclick="toggleWarn()"><span>⚠️ 安全提示</span><span id="warnArrow" class="'+(warnOpen?'open':'')+'">▼</span></div>';
  h+='<div class="warn-body'+(warnOpen?' show':'')+'" id="warnBody">';
  h+='<p>• 任何动作如果引发尖锐疼痛或放射痛，立即停止<br>';
  h+='• 训练应感到肌肉工作的酸胀感，而非关节刺痛<br>';
  h+='• 腰椎间盘突出急性期请遵医嘱，不要自行训练<br>';
  h+='• 孕妇请参考产前运动指南，避免仰卧位动作（孕中晚期）</p>';
  h+='</div></div>';

  h+='<div class="nav">';
  h+='<button class="nb" '+(cur===0?'disabled':'')+' onclick="go(-1)">← 上一个</button>';
  h+='<button class="nb" '+(cur===E.length-1?'disabled':'')+' onclick="go(1)">下一个 →</button>';
  h+='</div>';

  h+='<div class="ft"><h3>训练建议</h3><div>';
  h+='组间休息 30-60 秒 · 全程约 20-30 分钟<br>';
  h+='建议顺序：臀桥 → 鸟狗 → 死虫 → 超人 → 平板 → 猫牛<br>';
  h+='每个动作先感受目标肌群发力，不追求速度<br>';
  h+='每周 3-5 次，可作为晨起或睡前固定练习<br>';
  h+='坚持 2-4 周后评估疼痛改善情况，逐步增加难度';
  h+='</div></div>';

  h+='<div class="credit">真人视频来源：MuscleWiki.com · 仅供参考，不构成医疗建议</div>';

  m.innerHTML=h;

  var vid=document.getElementById('mainVid');
  if(vid){
    vid.onerror=function(){
      var box=vid.parentNode;
      var fb=document.createElement('div');
      fb.className='vid-fallback';
      fb.innerHTML='<div class="icon">🏋️</div><div>该角度视频暂无<br>请切换至另一角度</div>';
      vid.style.display='none';
      box.insertBefore(fb,vid.nextSibling);
    };
  }

  var dots=document.getElementById('dots');
  for(var i=0;i<e.mx;i++){
    var dt=document.createElement('div');
    dt.className='dot'+(i<d?(ad?' dn alldn':' dn'):'');
    dt.textContent=i<d?'✓':(i+1);
    dots.appendChild(dt);
  }

  rpills();uprog();
}

function go(dir){
  cur=Math.max(0,Math.min(E.length-1,cur+dir));
  angle='side';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function tick(id){
  var ex;
  for(var i=0;i<E.length;i++){if(E[i].id===id){ex=E[i];break;}}
  var c=gd(id);
  done[id]=c>=ex.mx?0:c+1;
  render();
}

render();
</script>
</body>
</html>
